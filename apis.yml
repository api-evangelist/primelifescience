name: Prime Life Science
description: >-
  Prime Life Science (璞睿生命科技) is a Chinese life-science technology company
  focused on digital and intelligent (数智化) clinical research. Its business spans
  the full lifecycle from clinical research to commercial decision-making, offering
  digital innovation solutions built on big data and artificial intelligence. The
  company positions itself as a "digital intelligent clinical research accelerator"
  aimed at driving innovative drug and device development, health management, and
  improved clinical-research decision-making and operational efficiency in China.
  Surfaced as a portfolio company of the Qiming venture fund and added to the API
  Evangelist network; the public presence is a WordPress marketing site with no
  developer or API surface discovered during enrichment.
